target-version = "py310"
line-length = 88
fix = true

exclude = [
    ".venv",
    ".eggs",
    ".git",
]

[lint]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "C",
    # "C4",  # flake8-comprehensions
    # "C90",  # mccabe
    "DJ",
    "E", "W",  # pycodestyle
    "F",  # pyflakes
    "FLY",
    "I",  # isort
    "N",
    "PGH",  # pygrep-hooks
    "PLC",
    "RUF",  # ruff
    "S",  # flake8-bandit
    "SIM",  # flake8-simplify
    "T10",  # flake8-debugger
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
]

ignore = [
    "E501",  # line too long 🤷
    "E731",  # DoNotAssignLambda
    "UP035",  # Deprecated import
    "UP006",
    "TRY003",  #Avoid specifying long messages outside the exception class
    "TRY400",  # Logging exception
]

[lint.isort]
known-first-party = ["apps"]
section-order = [
    "future",
    "standard-library",
    "third-party",

    "first-party",
    "local-folder"
]

[lint.per-file-ignores]
"tests/**/test_*.py" = [
    "S101", # allow `asserts` in tests
]

[format]
preview = true
